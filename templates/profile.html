<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="stars"></div>

<nav class="navbar navbar-expand-lg navbar-dark shadow"
style="background:linear-gradient(90deg,#2b1055,#7597de);">

<div class="container">

<a class="navbar-brand fw-bold" href="/">
🔮 AI Palmistry & Tarot
</a>

<div class="ms-auto">

<a href="/profile" class="btn btn-outline-light me-2">
<i class="fas fa-user"></i> Profile
</a>

<a href="/tarot" class="btn btn-warning me-2">
<i class="fas fa-magic"></i> Tarot
</a>

<a href="/history" class="btn btn-info me-2">
<i class="fas fa-history"></i> History
</a>

<a href="/logout" class="btn btn-danger">
<i class="fas fa-sign-out-alt"></i> Logout
</a>

</div>

</div>

</nav>

<div class="container mt-5">

<div class="card shadow-lg border-0 rounded-4 p-4"
style="background:rgba(255,255,255,.95);">

<div class="text-center">

<i class="fas fa-user-astronaut fa-5x text-warning"></i>

<h2 class="mt-3 fw-bold" style="color:gold;">
    {{ name }}
</h2>

<p class="text-muted">
    {{ email }}
</p>



</div>

<hr>

<div class="text-center mb-4">

<img id="preview"

src=""

style="display:none;
width:250px;
height:250px;
object-fit:cover;
border-radius:20px;
border:4px solid gold;"

class="shadow">

</div>

<form action="/upload"

method="POST"

enctype="multipart/form-data">

<div class="mb-3">

<label class="form-label">

<i class="fas fa-hand-paper"></i>

Upload Palm Image

</label>

<input

class="form-control"

type="file"

name="image"

required>

</div>

<button class="btn btn-warning btn-lg w-100">

<i class="fas fa-upload"></i>

Analyze Palm

</button>

</form>

<a href="/tarot"

class="btn btn-dark btn-lg w-100 mt-3">

🃏 Start Tarot Reading

</a>

<a href="/history"

class="btn btn-info btn-lg w-100 mt-3">

📜 Prediction History

</a>

<div class="card mt-4 border-0 shadow rounded-4 p-4">

<h3 class="text-center">

🧠 AI Personality Insights

</h3>

<hr>

<p>

<b>Personality :</b>

{{ personality }}

</p>

<p>

<b>Recommendation :</b>

{{ recommendation }}

</p>

<p>

<b>Life Trend :</b>

{{ trend }}

</p>

</div>

<a href="/logout"

class="btn btn-danger btn-lg w-100 mt-4">

Logout

</a>

</div>

</div>

<script>

const input=document.querySelector('input[type="file"]');

const preview=document.getElementById("preview");

input.onchange=function(){

const file=input.files[0];

if(file){

preview.src=URL.createObjectURL(file);

preview.style.display="block";

}

}

</script>

</body>

</html>
