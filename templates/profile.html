<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            🔮 AI Palmistry & Tarot
        </a>

        <br><br>


        <div class="ms-auto">
            <a href="/profile" class="btn btn-outline-light me-2">Profile</a>
            <a href="/tarot" class="btn btn-success me-2">Tarot</a>
            <a href="/logout" class="btn btn-danger">Logout</a>
        </div>
    </div>
</nav>
<div style="height:70px;"></div>
    <div class="container pt-5 mt-5">

    <div class="card shadow-lg p-4 rounded-4">

        <div class="text-center">

            <i class="fas fa-user-circle fa-5x text-primary"></i>

            <h2 class="mt-3">Welcome {{name}}</h2>

            <p class="text-muted">{{email}}</p>

        </div>

        <hr>

        <div class="text-center mb-4">
    <img id="preview"
         src=""
         class="img-fluid rounded shadow mx-auto d-block"
         style="display:none; width:250px; height:250px; object-fit:cover; border:3px solid #0d6efd;">
</div>

        <form action="/upload" method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-hand-paper"></i>
                    Upload Palm Image
                </label>

                <input class="form-control" type="file" name="image" required>
            </div>

            <button class="btn btn-primary w-100">
                <i class="fas fa-upload"></i>
                Analyze Palm
            </button>
            <br><br>

<a href="/history">
    <button type="button" class="btn btn-success w-100">
        <i class="fas fa-history"></i>
        View Prediction History
    </button>
</a>
<div class="card mt-3 p-3">
    <h4>🧠 AI Personality Insights</h4>

    <p><b>Personality:</b> {{ personality }}</p>

    <p><b>Recommendation:</b> {{ recommendation }}</p>

    <p><b>Life Trend:</b> {{ trend }}</p>
</div>

        </form>

        <br>

        <a href="/tarot" class="btn btn-success w-100">
            <i class="fas fa-magic"></i>
            Tarot Reading
        </a>

        <br><br>

        <a href="/logout" class="btn btn-danger w-100">
            <i class="fas fa-sign-out-alt"></i>
            Logout
        </a>

    </div>

</div>


<script>
const input = document.querySelector('input[type="file"]');
const preview = document.getElementById("preview");

input.onchange = function () {
    const file = input.files[0];

    if(file){
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    }
}
</script>

</body>
</html>
