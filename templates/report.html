<!DOCTYPE html>
<html>
<head>
    <title>Reading Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center text-primary">
            AI Palmistry & Tarot Intelligence Platform
        </h2>

        <hr>

        <h3>Reading Report</h3>

        <p><b>Image:</b> {{ filename }}</p>

        <hr>

        <h4>Life</h4>
        <p>{{ prediction.life }}</p>

        <h4>Career</h4>
        <p>{{ prediction.career }}</p>

        <h4>Love</h4>
        <p>{{ prediction.love }}</p>

        <h4>Fortune</h4>
        <p>{{ prediction.fortune }}</p>

        <hr>

        <h5 class="text-success">
            Thank You for using AI Palmistry & Tarot Intelligence Platform
        </h5>

        <a href="/profile" class="btn btn-primary mt-3">
            Back to Profile
        </a>

    </div>

</div>

</body>
</html>
