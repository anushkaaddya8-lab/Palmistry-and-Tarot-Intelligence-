<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>

<h2>Register</h2>

<form method="POST">
    <input type="text" name="username" placeholder="Username"><br><br>

    <input type="email" name="email" placeholder="Email"><br><br>

    <input type="password" name="password" placeholder="Password"><br><br>
    <input type="text" name="fullname" placeholder="Full Name"><br><br>

<select name="age_group">
    <option value="">Select Age Group</option>
    <option>15-20</option>
    <option>21-30</option>
    <option>31-40</option>
    <option>40+</option>
</select><br><br>

<input type="text" name="interest" placeholder="Spiritual Interest"><br><br>

<input type="text" name="goal" placeholder="Spiritual Goal"><br><br>

<select name="reading_preference">
    <option value="">Reading Preference</option>
    <option>Palm Reading</option>
    <option>Tarot Reading</option>
    <option>Both</option>
</select><br><br>

    <button type="submit">Register</button>
</form>

<br>

<a href="/">Home</a>

</body>
</html>
